<script>
document.getElementById('basvuruFormu').addEventListener('submit', async function(e) {
    e.preventDefault();

    const webhookUrl = "https://discord.com/api/webhooks/1550191840404180992/YmugDaCZZ4AFYudULVcPRD423KspcfAGgd2fVyfxVHSUjC-A8hgaHvNI1cN1Btcc5Pmt";

    const discordIsim = document.getElementById('discordIsim')?.value || 'Belirtilmedi';
    const yas = document.getElementById('yas')?.value || 'Belirtilmedi';
    const tecrube = document.getElementById('tecrube')?.value || 'Belirtilmedi';

    const payload = {
        embeds: [{
            title: "Yeni Yetkili Başvurusu!",
            color: 3447003,
            fields: [
                { name: "Discord Kullanıcı Adı", value: discordIsim, inline: true },
                { name: "Yaş", value: yas, inline: true },
                { name: "Tecrübe / Açıklama", value: tecrube, inline: false }
            ],
            footer: { text: "Discord Sunucu Başvuru Sistemi" },
            timestamp: new Date().toISOString()
        }]
    };

    try {
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert('Başvurunuz başarıyla gönderildi!');
            this.reset();
        } else {
            alert('Gönderim sırasında bir hata oluştu.');
        }
    } catch (error) {
        console.error('Hata:', error);
        alert('Bağlantı hatası oluştu.');
    }
});
</script>
